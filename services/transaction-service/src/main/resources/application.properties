# Local fallback URL for non-Docker runs; overridden by
# PYTHON_SERVICE_URL (http://python:8000) during docker-compose benchmarks.
python.service.url=http://localhost:8000

# Global DB Persistence Toggle for Empirical Test Isolation
# Defaults to false (fail-safe); the load-testing harness requires this disabled.
app.db.save.enabled=false

# H2 Reactive R2DBC In-Memory Database Configuration
spring.r2dbc.url=r2dbc:h2:mem:///transactiondb;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

# Enable R2DBC schema script execution on startup
spring.sql.init.mode=always

# H2 Web Console disabled: unauthenticated and exposed on a host-mapped
# port. Enable only for local, throwaway schema/data debugging.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# WebFlux event loop logging guard: prevents synchronous stdout write stalls
# on measured paths. Mandatory WARN level for benchmark validity.
logging.level.com.audit.transaction_service.service.TransactionService=WARN