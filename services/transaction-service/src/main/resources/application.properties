# Local fallback URL for non-Docker runs; overridden by
# PYTHON_SERVICE_URL (http://python:8000) during docker-compose benchmarks.
python.service.url=http://localhost:8000

# DB persistence toggle. Off by default (fail-safe); benchmarks require it off so
# DB writes never enter the measured path (compose sets APP_DB_SAVE_ENABLED=false).
app.db.save.enabled=false

# In-memory H2 over R2DBC; every restart starts empty.
spring.r2dbc.url=r2dbc:h2:mem:///transactiondb;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

# Runs schema.sql at startup. DatabaseConfig's initializer runs it too; the
# CREATE TABLE IF NOT EXISTS makes the repeat a no-op.
spring.sql.init.mode=always

# H2 web console off: it is unauthenticated. Its auto-configuration is servlet-only,
# so under WebFlux these keys are explicit fail-safe settings with no runtime effect.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# WARN floor on the measured path: Logback writes to stdout synchronously, so a
# per-request DEBUG/INFO line would stall a Netty event loop.
logging.level.com.audit.transaction_service.service.TransactionService=WARN