# Python FastAPI Microservice Base URL Configuration
python.service.url=http://localhost:8000

# Global DB Persistence Toggle for Empirical Test Isolation
app.db.save.enabled=true

# H2 Reactive R2DBC In-Memory Database Configuration
spring.r2dbc.url=r2dbc:h2:mem:///transactiondb;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

# Enable R2DBC schema script execution on startup
spring.sql.init.mode=always

# Enable H2 Web Console via standard webflux properties if needed
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
