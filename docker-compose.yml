services:
    python-service:
        build: ./services/fraud-ml-service
        container_name: python
        # The image sets no USER; run as the host user so bind-mount writes are owned by it (setup.sh writes .env).
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        ports:
            - "8000:8000"
        volumes:
            - ./services/fraud-ml-service/models:/app/models
        environment:
            - FEATURE_TIERS=5,10,20,28
            - MODEL_DIR=models
            - PYTHONUNBUFFERED=1
            # run-ablation.sh sets both explicitly per cell. THREAD_LIMITER_TOKENS is an
            # explicit experimental parameter rather than anyio's internal default.
            - UVICORN_WORKERS=${UVICORN_WORKERS:-3}
            - THREAD_LIMITER_TOKENS=${THREAD_LIMITER_TOKENS:-40}
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
            interval: 30s
            start_interval: 2s
            timeout: 3s
            retries: 10
            start_period: 10s
        # Physical cores 0, 2, 4 on the reference host (CPUs 0-1, 4-5, 8-9), disjoint from Java and k6.
        cpuset: "${PYTHON_CPUSET:-0-1,4-5,8-9}"
        # Enforced by plain `docker compose up` (unlike deploy.resources.limits).
        mem_limit: 3g
        mem_reservation: 1g
        cpus: ${PYTHON_CPUS:-6.0}
        networks:
            - testbed-net

    transaction-service:
        build: ./services/transaction-service
        container_name: java
        # Same reason as python-service, for the GC log directory mounted below.
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        ports:
            - "8080:8080"
        environment:
            - PYTHON_SERVICE_URL=http://python:8000
            - APP_DB_SAVE_ENABLED=false
            # Outbound pool to python-service. Each harness script exports 2x its own peak
            # VUs so a wait for a free connection never lands inside the AI call round trip.
            - PYTHON_SERVICE_MAX_CONNECTIONS=${PYTHON_SERVICE_MAX_CONNECTIONS:-128}
            # Fixed heap, so sizing is identical across hosts and reps; the GC log lets latency
            # spikes be checked against GC pauses. Collector, GC thread counts and Netty's
            # event-loop count are pinned rather than left to JVM ergonomics, which derives them
            # from cgroup CPU/memory detection and may resolve differently across hosts or JDK
            # builds. Values match this container's 4-CPU cpuset and cpus: 4.0.
            - JAVA_TOOL_OPTIONS=-Xms1536m -Xmx1536m -XX:+UseG1GC -XX:ParallelGCThreads=4 -XX:ConcGCThreads=1 -Dreactor.netty.ioWorkerCount=4 -Xlog:gc*:file=/gc-logs/gc.log:time,uptime,level,tags:filecount=0
        # RUN_RESULTS_DIR is the harness's per-run directory; a hand-started stack uses ./results.
        volumes:
            - ${RUN_RESULTS_DIR:-./results}/gc-logs:/gc-logs
        depends_on:
            python-service:
                condition: service_healthy
        # Physical cores 1, 3 on the reference host (CPUs 2-3, 6-7), interleaved with
        # python-service's even cores so the two services share no physical core. On another
        # host, load-testing/recommend-cpusets.sh prints suitable values, and
        # verify_service_cpuset() refuses a cpuset that splits a core.
        cpuset: "${JAVA_CPUSET:-2-3,6-7}"
        mem_limit: 3g
        mem_reservation: 1g
        cpus: ${JAVA_CPUS:-4.0}
        networks:
            - testbed-net

    # Load generator on its own cores. Behind a profile so `docker compose up` does not
    # start it; the harness scripts run it per cell with `docker compose run`.
    k6:
        # Pinned tag: the only image not built from this tree, so a floating tag would be an
        # uncontrolled dependency. run_metadata.json records the resolved digest.
        image: grafana/k6:0.54.0
        profiles: ["loadgen"]
        entrypoint: ["k6"]
        working_dir: /scripts
        # The upstream image's fixed non-root UID does not match the host user either.
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        volumes:
            - ./load-testing:/scripts
            - ${RUN_RESULTS_DIR:-./results}:/results
        environment:
            - BASE_URL=http://java:8080/api/v1/transactions
        # Physical cores 5, 7 on the reference host (CPUs 10-11, 14-15), disjoint from both services.
        cpuset: "${K6_CPUSET:-10-11,14-15}"
        mem_limit: 1g
        cpus: ${K6_CPUS:-4.0}
        networks:
            - testbed-net

networks:
    testbed-net:
        driver: bridge