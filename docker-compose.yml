services:
    python-service:
        build: ./services/fraud-ml-service
        container_name: python
        # No USER in the Dockerfile -- pins bind-mount writes to the host user (see setup.sh).
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        ports:
            - "8000:8000"
        volumes:
            - ./services/fraud-ml-service/models:/app/models
        environment:
            - FEATURE_TIERS=5,10,20,28
            - MODEL_DIR=models
            - PYTHONUNBUFFERED=1
            # Both overridable by run-ablation.sh, which always passes its own explicit value
            # per cell. THREAD_LIMITER_TOKENS is pinned here as an explicit experimental
            # parameter rather than left to anyio's internal default.
            - UVICORN_WORKERS=${UVICORN_WORKERS:-3}
            - THREAD_LIMITER_TOKENS=${THREAD_LIMITER_TOKENS:-40}
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
            interval: 30s
            start_interval: 2s
            timeout: 3s
            retries: 10
            start_period: 10s
        # Sets default Python cpuset to physical cores 0, 2, and 4 (6 logical CPUs) for physical isolation from Java and k6.
        cpuset: "${PYTHON_CPUSET:-0-1,4-5,8-9}"
        # Enforced by plain `docker compose up` (unlike deploy.resources.limits).
        mem_limit: 3g
        mem_reservation: 1g
        cpus: ${PYTHON_CPUS:-6.0}
        networks:
            - testbed-net

    transaction-service:
        build: ./services/transaction-service
        container_name: java
        # Same reason as python-service, for results/gc-logs/.
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        ports:
            - "8080:8080"
        environment:
            - PYTHON_SERVICE_URL=http://python:8000
            - APP_DB_SAVE_ENABLED=false
            # Outbound pool to python-service. Both harness scripts export 2x their
            # own peak VUS so the pool can never become the bottleneck being measured.
            - PYTHON_SERVICE_MAX_CONNECTIONS=${PYTHON_SERVICE_MAX_CONNECTIONS:-128}
            # Fixed heap for reproducible sizing across hosts/reps. GC log lets
            # tail-latency spikes be cross-checked against GC pauses.
            # Collector, GC worker-thread counts, and Netty's event-loop size are pinned
            # explicitly rather than left to JVM ergonomics, which derives them from cgroup
            # CPU/memory detection and is not guaranteed to resolve identically across hosts
            # or JDK builds. Values match this container's own cpus: 4.0 / 4-core cpuset.
            - JAVA_TOOL_OPTIONS=-Xms1536m -Xmx1536m -XX:+UseG1GC -XX:ParallelGCThreads=4 -XX:ConcGCThreads=1 -Dreactor.netty.ioWorkerCount=4 -Xlog:gc*:file=/gc-logs/gc.log:time,uptime,level,tags:filecount=0
        volumes:
            - ./results/gc-logs:/gc-logs
        depends_on:
            python-service:
                condition: service_healthy
        # Physical cores 1, 3 (CPUs 2-3, 6-7) — interleaved with python-service's
        # even-numbered cores so no physical core is shared between the two services.
        cpuset: "2-3,6-7"
        mem_limit: 3g
        mem_reservation: 1g
        cpus: 4.0
        networks:
            - testbed-net

    # Load generator, pinned to its own core range. Behind a profile so
    # `docker compose up` doesn't start it; run-suite.sh invokes it per-cell
    # via `docker compose run`.
    k6:
        # Pinned rather than :latest -- the only image not built from this tree, so a
        # floating tag would be the one uncontrolled dependency in the measurement.
        # run_metadata.json records the resolved digest for each run.
        image: grafana/k6:0.54.0
        profiles: ["loadgen"]
        entrypoint: ["k6"]
        working_dir: /scripts
        # Upstream image's own fixed non-root UID doesn't match the host either.
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        volumes:
            - ./load-testing:/scripts
            - ./results:/results
        environment:
            - BASE_URL=http://java:8080/api/v1/transactions
        # Physical cores 5, 7 (CPUs 10-11, 14-15) — disjoint from both services.
        cpuset: "10-11,14-15"
        mem_limit: 1g
        cpus: 4.0
        networks:
            - testbed-net

networks:
    testbed-net:
        driver: bridge