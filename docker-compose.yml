services:
  python-service:
    build: ./services/fraud-ml-service
    container_name: python
    ports:
      - "8000:8000"
    volumes:
      - ./services/fraud-ml-service/models:/app/models
    environment:
      - FEATURE_TIERS=5,10,20,28
      - MODEL_DIR=models
      - PYTHONUNBUFFERED=1
      - UVICORN_WORKERS=3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpuset: "0-2"
    # Enforced by plain `docker compose up` (unlike deploy.resources.limits).
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 3.0
    networks:
      - testbed-net

  transaction-service:
    build: ./services/transaction-service
    container_name: java
    ports:
      - "8080:8080"
    environment:
      - PYTHON_SERVICE_URL=http://python:8000
      - APP_DB_SAVE_ENABLED=false
      # Fixed heap for reproducible sizing across hosts/reps. GC log lets
      # tail-latency spikes be cross-checked against GC pauses.
      - JAVA_TOOL_OPTIONS=-Xms1536m -Xmx1536m -Xlog:gc*:file=/gc-logs/gc.log:time,uptime,level,tags:filecount=0
    volumes:
      - ./results/gc-logs:/gc-logs
    depends_on:
      python-service:
        condition: service_healthy
    cpuset: "3-5"
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 3.0
    networks:
      - testbed-net

  # Load generator, pinned to its own core range. Behind a profile so
  # `docker compose up` doesn't start it; run-suite.sh invokes it per-cell
  # via `docker compose run`.
  k6:
    image: grafana/k6:latest
    profiles: ["loadgen"]
    entrypoint: ["k6"]
    working_dir: /scripts
    volumes:
      - ./load-testing:/scripts
      - ./results:/results
    environment:
      - BASE_URL=http://java:8080/api/v1/transactions
    cpuset: "6-7"
    mem_limit: 1g
    cpus: 2.0
    networks:
      - testbed-net

networks:
  testbed-net:
    driver: bridge